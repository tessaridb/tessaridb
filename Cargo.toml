[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0-beta"
edition = "2024"
rust-version = "1.85"
license = "BUSL-1.1"
authors = ["boogvar"]
repository = "https://github.com/tessaridb/tessaridb"
publish = false

[workspace.dependencies]
tessari-types = { path = "crates/tessari-types", version = "0.5.0-beta" }
tessari-constants = { path = "crates/tessari-constants", version = "0.5.0-beta" }
tessari-kv = { path = "crates/tessari-kv", version = "0.5.0-beta" }
tessari-encoding = { path = "crates/tessari-encoding", version = "0.5.0-beta" }
tessari-geo = { path = "crates/tessari-geo", version = "0.5.0-beta" }
tessari-storage = { path = "crates/tessari-storage", version = "0.5.0-beta" }
tessari-lsm = { path = "crates/tessari-lsm", version = "0.5.0-beta" }
tessari-ql = { path = "crates/tessari-ql", version = "0.5.0-beta" }
tessari-session = { path = "crates/tessari-session", version = "0.5.0-beta" }
tessari-conformance = { path = "crates/tessari-conformance", version = "0.5.0-beta" }
tessaridb = { path = "crates/tessaridb", version = "0.5.0-beta" }
tessari-backup = { path = "crates/tessari-backup", version = "0.5.0-beta" }
tessari-wire = { path = "crates/tessari-wire", version = "0.5.0-beta" }
tessari-http = { path = "crates/tessari-http", version = "0.5.0-beta" }
tessari-ingest = { path = "crates/tessari-ingest", version = "0.5.0-beta" }
tessari-serve = { path = "crates/tessari-serve", version = "0.5.0-beta" }
tessari-vault = { path = "crates/tessari-vault", version = "0.5.0-beta" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
# The RustCrypto SHA-2. Chosen over hand-rolling it: `digest` 0.10 is already
# in the tree under `argon2`, so this shares its traits and buffering rather
# than adding a parallel stack, and a database is the last place to keep its
# own two hundred lines of unaudited bit manipulation.
sha2 = { version = "0.10", default-features = false }
# MD5 and SHA-1, from the same author as `sha2` and over the same `digest` 0.10
# traits already in the tree — so they add algorithms and no second stack. Both
# are **broken** for anything needing collision resistance and neither is in the
# language for security: a store interoperates, and an ETag, a legacy row key or
# a content id somebody else computed cannot be checked against without them.
# The alternative is not "safer", it is "the caller cannot do it here".
md-5 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
# The AEAD every sealed value is encrypted under. ChaCha20-Poly1305 rather than
# AES-GCM because it is constant-time in pure Rust with no hardware dependency,
# and one source tree here produces both an arm64 and an amd64 image — an AES
# implementation without AES-NI is either slow or timing-variable, and neither is
# acceptable on the one surface whose whole purpose is to keep a secret.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
# The operating system's entropy. A database is the last place to carry its own
# entropy pool, and every key in the hierarchy starts here.
getrandom = "0.4"
# Key material erased at a named end of life. The crate exists because the
# compiler is entitled to delete a wipe that nothing afterwards observes, and a
# hand-written `for b in buf { *b = 0 }` is exactly that wipe.
zeroize = { version = "1.9", features = ["zeroize_derive"] }
# TLS for the inter-node link, and nothing else in this workspace speaks it.
# `rustls` with the `ring` provider rather than `aws-lc-rs`: the provider is the
# whole build-system question, and `ring` asks only for the `cc` that
# `rust:1.98-slim-bookworm` already carries, where `aws-lc-rs` wants cmake and
# brings the OpenSSL licence with it — a licence `deny.toml` does not allow.
# Measured before it was chosen: six crates net-new to this workspace and a 6.5 s
# cold build. `native-tls` was refused for the opposite reason — a C build and a
# platform certificate store in an image that is deliberately one binary on a
# slim base.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Already inside rustls's own tree, declared here because the peer link calls it
# directly: it is what lets a credential be ASKED whether it is valid for a name
# instead of being parsed for one. Naming it costs no crate and makes the
# dependency visible where it is used.
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
# The only way a chain reaches the process. `Credential.chain` is a chain, and
# DER has no container for one — a DER-only reader would force one file per
# certificate and a flag that takes a list. From the rustls project, already
# this tree's TLS vendor.
# Test-only, and deliberately never a dependency: the peer tests mint their own
# certificate authority in memory, so no key material is ever written to this
# repository and no fixture can go stale.
rcgen = "0.13"
# Facade only. The binary picks the implementation, so a library caller keeps
# control of whether anything is emitted at all, and `log` pulls in nothing.
log = { version = "0.4", features = ["std"] }

proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
panic = "deny"
arithmetic_side_effects = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
# Dependency debug info is linked into every one of this workspace's test
# binaries and nobody steps into a dependency frame — and at opt-level 2
# those frames are inlined past in any case.
debug = false

[profile.dev.build-override]
opt-level = 3
