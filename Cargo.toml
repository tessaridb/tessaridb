[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1-alpha"
edition = "2024"
rust-version = "1.85"
license = "BUSL-1.1"
authors = ["boogvar"]
repository = "https://github.com/TessariDB/TessariDB"
publish = false

[workspace.dependencies]
tessari-types = { path = "crates/tessari-types" }
tessari-constants = { path = "crates/tessari-constants" }
tessari-kv = { path = "crates/tessari-kv" }
tessari-encoding = { path = "crates/tessari-encoding" }
tessari-geo = { path = "crates/tessari-geo" }
tessari-storage = { path = "crates/tessari-storage" }
tessari-lsm = { path = "crates/tessari-lsm" }
tessari-ql = { path = "crates/tessari-ql" }
tessari-session = { path = "crates/tessari-session" }
tessari-conformance = { path = "crates/tessari-conformance" }
tessaridb = { path = "crates/tessaridb" }
tessari-backup = { path = "crates/tessari-backup" }
tessari-wire = { path = "crates/tessari-wire" }
tessari-http = { path = "crates/tessari-http" }
tessari-serve = { path = "crates/tessari-serve" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }

proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
panic = "deny"
arithmetic_side_effects = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 3
