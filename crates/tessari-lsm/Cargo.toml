[package]
name = "tessari-lsm"
description = "Persistent key-value backend for TessariDB on a log-structured merge-tree engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tessari-kv.workspace = true
tessarikv.workspace = true
thiserror.workspace = true
tessari-vault.workspace = true
dashmap.workspace = true
# A dropped store closes on the runtime it was opened on (`kv::closing`).
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
# The index-format tests read an old index back through the language, so they
# need the layer that speaks it and the codec that describes what is on disk.
# Both are already in the tree; nothing new is fetched.
tessari-encoding.workspace = true
tessari-session = { workspace = true, features = ["test-support"] }
tessari-storage.workspace = true
tessari-types.workspace = true
tempfile.workspace = true
# The TessariKV backend's tests drive its futures; the library itself creates no runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
