[package]
name = "tessari-http"
description = "An HTTP surface for TessariDB: run a script, ask whether the node is alive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# On by default, because a database with no interface is the case that needs one
# most — an operator with no route out gets nothing otherwise. Off costs the
# binary nothing but the console's bytes, which is why the switch exists at all.
default = ["console"]
console = []

[dependencies]
dashmap.workspace = true
tessaridb.workspace = true
tessari-constants.workspace = true
tessari-serve.workspace = true
tessari-types.workspace = true
tracing.workspace = true
thiserror.workspace = true
axum.workspace = true
futures-util = { workspace = true, features = ["sink"] }
# Requests are tasks on the process's runtime, which the binary builds; this
# crate creates none (ADR-0085).
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros", "io-util"] }
tokio-util.workspace = true
tungstenite.workspace = true
# TLS on the listener (ADR-0108 D4): the rustls the peer link already uses.
rustls.workspace = true
tokio-rustls.workspace = true
# A password a request carried is wiped when the request is done with it
# (G061, R-06). Already in the tree.
zeroize.workspace = true

[dev-dependencies]
# The tests serve a node, and a node is served on a runtime the caller owns.
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tessari-backup.workspace = true
tessari-kv.workspace = true
# The status table is asserted per error variant, and building one needs the
# span every diagnostic carries and the dependency kind `StillDepended` names.
# Neither is re-exported through `tessaridb`, which carries the error type only.
tessari-ql.workspace = true
tessari-session.workspace = true
tessari-storage.workspace = true
# The redirect's epoch and the width of the node id it names, for the same
# reason: `ReadIsElsewhere` carries both and `tessaridb` re-exports the error
# without the types inside it. The width comes from the constant that owns it
# rather than being written as `16` here, which is how a restated number drifts.
tessari-types.workspace = true
tessari-encoding.workspace = true
tessari-wire.workspace = true
# The TLS tests mint their certificate authority in memory, so no key is ever
# written to this repository, and read it with the node's own reader.
rcgen.workspace = true
tessari-serve.workspace = true

[lints]
workspace = true
