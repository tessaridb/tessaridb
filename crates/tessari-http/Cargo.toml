[package]
name = "tessari-http"
description = "An HTTP surface for TessariDB: run a script, ask whether the node is alive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# On by default, because a database with no interface is the case that needs one
# most — an operator with no route out gets nothing otherwise. Off costs the
# binary nothing but the console's bytes, which is why the switch exists at all.
default = ["console"]
console = []

[dependencies]
tessaridb.workspace = true
tessari-constants.workspace = true
tessari-serve.workspace = true
tessari-types.workspace = true
log.workspace = true
thiserror.workspace = true
tiny_http = "0.12"

[dev-dependencies]
tessari-backup.workspace = true
tessari-kv.workspace = true
# The status table is asserted per error variant, and building one needs the
# span every diagnostic carries and the dependency kind `StillDepended` names.
# Neither is re-exported through `tessaridb`, which carries the error type only.
tessari-ql.workspace = true
tessari-session.workspace = true
tessari-storage.workspace = true
# The redirect's epoch and the width of the node id it names, for the same
# reason: `ReadIsElsewhere` carries both and `tessaridb` re-exports the error
# without the types inside it. The width comes from the constant that owns it
# rather than being written as `16` here, which is how a restated number drifts.
tessari-types.workspace = true
tessari-encoding.workspace = true

[lints]
workspace = true
