[package]
name = "tessaridb"
description = "The embedded front door to TessariDB: open a database, run a script, follow the changes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tessari-kv.workspace = true
tessari-lsm.workspace = true
tessari-ql.workspace = true
tessari-session.workspace = true
tessari-storage.workspace = true
tessari-types.workspace = true
# `watch` alone: an async feed waits on the commit signal without this crate
# gaining a runtime or a single `async fn` (ADR-0085 §2, §4).
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tessari-encoding.workspace = true
tessari-types.workspace = true
tempfile.workspace = true

[lints]
workspace = true
