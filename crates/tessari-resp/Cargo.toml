[package]
name = "tessari-resp"
description = "The RESP protocol as a surface of a TessariDB node: its spaces, its users"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dashmap.workspace = true
thiserror.workspace = true
tessaridb.workspace = true
tessari-constants.workspace = true
tessari-serve.workspace = true
tessari-types.workspace = true
tracing.workspace = true
zeroize.workspace = true
# Connections are tasks on the process's runtime, which the binary builds;
# this crate creates none (ADR-0085).
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros", "io-util"] }
tokio-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
# A certificate minted per test for the TLS rows of the negative matrix (G079 C8).
tessari-serve = { workspace = true, features = ["test-support"] }
# The surface is served in its tests on a runtime the test owns.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# A cluster arranged in the test: a membership row and a leadership (G079 W5d).
tessari-encoding.workspace = true
tessari-storage = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
