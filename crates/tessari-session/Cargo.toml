[package]
name = "tessari-session"
description = "Executing TessariQL scripts against a TessariDB store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
dashmap.workspace = true
sha2.workspace = true
md-5.workspace = true
sha1.workspace = true
tessari-constants.workspace = true
tessari-backup.workspace = true
tessari-encoding.workspace = true
tessari-geo.workspace = true
tessari-ql.workspace = true
tessari-serve.workspace = true
tessari-storage.workspace = true
tessari-types.workspace = true
tessari-vault.workspace = true
rust_decimal.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[features]
# What tests and the synchronous harnesses use to run a script without a runtime of their own (`RunNow`).
test-support = ["tessari-storage/test-support"]

[dev-dependencies]
tessari-session = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["rt"] }
tessari-encoding.workspace = true
tessari-kv.workspace = true
tessari-lsm.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
