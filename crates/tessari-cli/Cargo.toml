[package]
name = "tessari-cli"
description = "tessaridb — a command line for TessariDB: open a store, run a statement, read the answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tessaridb"
path = "src/main.rs"

[features]
# Carry the broker client, so this binary can actually run a declared consumer.
# Off by default because the client compiles librdkafka and therefore needs a C
# toolchain, which an ordinary build of this database must not (ADR-0024 §2).
kafka = ["tessari-ingest/kafka"]

[dependencies]
tessaridb.workspace = true
tessari-backup.workspace = true
tessari-http.workspace = true
tessari-ingest.workspace = true
tessari-serve.workspace = true
# Installing a signal handler is not expressible in safe Rust and `std` has no
# signal API. Already in the tree through the engine, so this costs no crate.
libc = "0.2"
log.workspace = true
tessari-ql.workspace = true
tessari-session.workspace = true
tessari-storage.workspace = true
tessari-types.workspace = true
tessari-wire.workspace = true

[dev-dependencies]
# Already in the tree through `tessari-types`; nothing new is fetched, and a test
# that builds a decimal needs the type that holds one.
rust_decimal.workspace = true
# Already in the tree through `tessari-wire`'s own tests; a peer door needs a
# credential, and a fixture on disk would be key material in a repository with
# an expiry date nobody chose.
rcgen.workspace = true
tessari-kv.workspace = true
# Already in the tree through `tessari-lsm`; the process-level test needs a
# directory that cleans itself up when the node it served is killed.
tempfile = "3"

[lints]
workspace = true
