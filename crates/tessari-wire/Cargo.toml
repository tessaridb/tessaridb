[package]
name = "tessari-wire"
description = "The wire protocol for TessariDB: framed TCP carrying values in the store's own encoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# On by default so every existing caller in this workspace is unaffected, and
# `--no-default-features` gives the half a client needs.
#
# The split is not tidiness: `tessaridb` reaches the storage engine, so a client
# built with the server half would compile RocksDB — and a password hasher, and
# the serving crate — in order to send a SELECT down a socket. Both halves stay
# in one crate on purpose, so that a change to a frame breaks the other end at
# compile time rather than in somebody's deployment.
default = ["server"]
# A client that speaks TLS to a node (ADR-0108 D4). Apart from `server` so a lean
# client takes rustls only when it asks for it.
tls = ["dep:rustls"]
server = [
    "tls",
    "dep:dashmap",
    "dep:getrandom",
    "dep:tessari-constants",
    "dep:tessaridb",
    "dep:tessari-serve",
    "dep:tessari-session",
    "dep:tessari-storage",
    "dep:tracing",
    "dep:rustls",
    "dep:rustls-webpki",
    "dep:sha2",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-rustls",
]

[dependencies]
# Server-side only: the replay table of signed assertions (ADR-0108 D3) and the
# nonces they carry. Both already in the tree.
dashmap = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
tessaridb = { workspace = true, optional = true }
tessari-serve = { workspace = true, optional = true }
# Server-side only: the ceiling and the greeting deadline are the node's,
# and a client has no door to hold.
tessari-constants = { workspace = true, optional = true }
tessari-encoding.workspace = true
tessari-ql.workspace = true
tessari-session = { workspace = true, optional = true }
tessari-storage = { workspace = true, optional = true }
tessari-types.workspace = true
# Server-side only: a client that logs nothing keeps the crate count the lean
# build is measured by.
tracing = { workspace = true, optional = true }
# Server-side only, and the peer link is the only caller: a client speaks to a
# node over the wire's own framing and has no peer to authenticate.
rustls = { workspace = true, optional = true }
rustls-webpki = { workspace = true, optional = true }
# Server-side only: a credential is read where a node is started, and a client
# presents one it was handed rather than one it loaded.
# The fingerprint a refusal names when a credential does not name the node the
# greeting claims. Already in the tree.
sha2 = { workspace = true, optional = true }
# Server-side only: connections are tasks on the process's runtime, which the
# binary builds; this crate creates none (ADR-0085).
tokio = { workspace = true, optional = true, features = ["net", "io-util", "time", "rt", "sync", "macros"] }
tokio-util = { workspace = true, optional = true }
# Server-side only: the peer door completes its mutual TLS on the runtime.
tokio-rustls = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
tessari-constants.workspace = true
# The reporting test captures what a served connection says, as a subscriber.
tracing-subscriber.workspace = true
# The tests serve a node, and a node is served on a runtime the caller owns.
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tokio-util.workspace = true
# Replication is driven explicitly in the forwarding test: nothing pulls on its
# own yet (Q-83), so "visible on both" is shown by moving the log across rather
# than by waiting for a driver that does not exist.
tessari-backup.workspace = true
rust_decimal.workspace = true
# The test certificate authority, minted in memory per test.
rcgen.workspace = true
# The client surfaces' TLS reader, for the node the TLS tests start.
tessari-serve.workspace = true

# These four drive a node, so without the server half there is nothing for them
# to drive. Declared as `required-features` rather than gated with an inner
# `#![cfg]`: that strips the file's own crate documentation too, leaving an empty
# crate that trips `missing_docs` — a warning in the very configuration a client
# builds. Here the target simply is not built.
[[test]]
name = "binding"
required-features = ["server"]

[[test]]
name = "forwarding"
required-features = ["server"]

[[test]]
name = "pushing"
required-features = ["server"]

[[test]]
name = "talking"
required-features = ["server"]

[[test]]
name = "reporting"
required-features = ["server"]

[lints]
workspace = true
