[package]
name = "bgv-db-cli"
description = "bgv — a command line for bgv-db: open a store, run a statement, read the answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bgv"
path = "src/main.rs"

[dependencies]
bgv-db.workspace = true
bgv-db-backup.workspace = true
bgv-db-storage.workspace = true
bgv-db-types.workspace = true
bgv-db-wire.workspace = true

[dev-dependencies]
# Already in the tree through `bgv-db-types`; nothing new is fetched, and a test
# that builds a decimal needs the type that holds one.
rust_decimal.workspace = true
bgv-db-kv.workspace = true
bgv-db-session.workspace = true

[lints]
workspace = true
