[package]
name = "tessari-storage"
description = "Records and transactions over the TessariDB key-value substrate: snapshot isolation on the log sequence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dashmap.workspace = true
getrandom.workspace = true
tessari-constants.workspace = true
tessari-encoding.workspace = true
tessari-geo.workspace = true
tessari-kv.workspace = true
tessari-types.workspace = true
tessari-vault.workspace = true
tracing.workspace = true
scc.workspace = true
thiserror.workspace = true
# The write gate: an async turn, a landing wait, and the id of the task holding the turn.
tokio = { workspace = true, features = ["rt", "sync"] }
futures-util.workspace = true

[features]
# What tests and the synchronous harnesses use to drive the store's asynchronous entry points
# without a runtime of their own (`now`, `Now`).
test-support = ["tokio/rt-multi-thread"]

[dev-dependencies]
tessari-storage = { path = ".", features = ["test-support"] }

[lints]
workspace = true
