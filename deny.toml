[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
# A dependency without a version range floats, and a floating dependency is a
# build that changes without anyone changing it.
wildcards = "deny"
# …except the crates of this workspace, which are path dependencies and have
# nothing to float to: they are this repository. Without this, the rule fires on
# every internal edge and says nothing about the third-party surface it exists to
# guard.
allow-wildcard-paths = true

[licenses]
version = 2
# Licences acceptable in third-party dependencies. This list governs what may be
# pulled in as a dependency; it does not describe TessariDB's own licence,
# which is the Business Source License 1.1 (see LICENSE).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
