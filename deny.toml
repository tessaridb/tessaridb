[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
# Licences acceptable in third-party dependencies. This list governs what may be
# pulled in as a dependency; it does not describe bgv-db's own licence, which is
# proprietary and commercial (see LICENSE).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
