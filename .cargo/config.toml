# How the tests are run here.
#
# `cargo t` is the per-wave command: every lib and integration test, and no doc
# examples. Warm, it finishes in well under a minute.
#
# `cargo tdoc` runs the doc examples, and only that. It is slow — around
# eighteen minutes — and the cost is not the tests: rustdoc compiles and runs
# every example in this project's very heavy doc comments, which is roughly
# 17.8 of those minutes. Run it when a goal closes, not per wave.
#
# The bare `cargo test --workspace` runs both and is therefore the slow path by
# accident rather than by choice. Prefer the two names above, which say which
# one is meant.
[alias]
t = "test --workspace --tests"
tdoc = "test --workspace --doc"
lint = "clippy --workspace --all-targets --all-features -- -D warnings"

# One target directory: the standard `target/`.
#
# There used to be three — `target-pkg` for per-package runs, `target-lint` for
# clippy, `target-check` for `cargo check` — because those are three compile
# modes and sharing one directory makes them evict each other's fingerprints, so
# alternating tools paid a rebuild every time.
#
# Retired 2026-09-11 on the owner's instruction. The eviction is still real; what
# changed is the price of avoiding it. Measured that day: `target/` alone held
# 100 GB, beside 5.8 GB in `target-pkg`, 1.2 GB in `target-lint`, 497 MB in
# `target-check` and a stray 423 MB `target-pkg` that a mis-rooted run had left
# inside a test suite. Disk stopped being the cheap side of the trade.
#
# What makes one directory affordable is not alternating tools. Run the gates in
# ONE batch at the end of a wave — `cargo fmt --all --check`, then `cargo t`,
# then `cargo lint` — and pay the rebuild once instead of once per step. The
# first `cargo lint` after a test run is not cheap: measured cold on 2026-09-11
# it took 60 minutes, and the same command warm takes half a second.
#
# Two companions come back with it. Do not alternate `-p <crate>` and
# `--workspace`: the two selections unify features differently and now invalidate
# each other again, so iterate inside one crate and switch to the workspace run
# once, at the boundary. And validate a manifest with `cargo metadata --no-deps`,
# which compiles nothing, rather than with `cargo check`.
